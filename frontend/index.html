    <!--
      CRITICAL: Prevent flash of wrong theme.
      Reads persisted Zustand state from localStorage BEFORE React mounts.
      Zustand persist key is 'sdcfrs-theme', value is {"state":{"isDarkMode":true},...}
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sdcfrs-theme')
          var isDark = false
          if (raw) {
            var parsed = JSON.parse(raw)
            isDark = !!(parsed && parsed.state && parsed.state.isDarkMode)
          }
          var html = document.documentElement
          var body = document.body
          if (isDark) {
            html.classList.add('dark')
            html.setAttribute('data-theme', 'dark')
            if (body) { body.classList.add('dark-theme'); body.classList.remove('light-theme') }
          } else {
            html.classList.remove('dark')
            html.setAttribute('data-theme', 'light')
            if (body) { body.classList.add('light-theme'); body.classList.remove('dark-theme') }
          }
        } catch (e) { /* silent — defaults to light */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
