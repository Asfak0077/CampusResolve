name: 🐛 Bug report
description: Something is broken — help us reproduce it
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **do not** include real credentials, connection strings or API keys.
        Security vulnerabilities belong in [Security Advisories](../../security/advisories/new), not here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
      placeholder: I clicked "Submit complaint" and got a 500 error, but expected a success message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as student@campusresolve.edu
        2. Go to /student
        3. Fill the form and submit
        4. See error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Authentication / login
        - Student dashboard
        - Teacher dashboard
        - Admin dashboard
        - Complaints
        - Feedback
        - AI assistant / voice
        - Email / notifications
        - Uploads
        - Deployment / build
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which backend mode were you running?
      description: Check your API log — offline mode prints "MONGO_URI is not configured. Running in offline/demo mode."
      options:
        - MongoDB Atlas (connected)
        - Offline / demo mode (no MONGO_URI)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: Browser console and API terminal output. Redact any secrets.
      render: shell
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "node -v → v20.11.1"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem
          required: true
        - label: I removed all credentials, tokens and personal data from this report
          required: true
