name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build:frontend
        env:
          VITE_API_BASE_URL: /api

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend — syntax and boot check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every backend module
        run: npm --workspace backend run lint

      - name: Boot the API and run the authorization smoke test
        env:
          PORT: 5001
          SECRET_KEY: ci-only-secret-not-used-anywhere-else
          SEED_DEMO_DATA: 'true'
        run: |
          node backend/src/server.js & echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:5001/api/health
          node backend/scripts/security-smoke-test.mjs
          kill "$(cat server.pid)"
